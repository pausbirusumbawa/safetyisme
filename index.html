/* ============================================================
   LZ COMPRESS — URL SHARING
   ============================================================ */
const LZ = {
  compress(s){
    try{
      return btoa(unescape(encodeURIComponent(s)))
        .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    }catch(e){ return btoa(s); }
  },
  decompress(s){
    try{
      let b = s.replace(/-/g,'+').replace(/_/g,'/');
      while(b.length % 4) b += '=';
      return decodeURIComponent(escape(atob(b)));
    }catch(e){
      try{ return atob(s); }catch(e2){ return null; }
    }
  }
};

/* ============================================================

/* ============================================================
   FUNGSI UPGRADE: TANDA TANGAN (CANVAS)
   ============================================================ */
function initSignaturePad(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  // Set white background agar saat di convert jadi Base64 tidak hitam
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.strokeStyle = '#1e3a5f';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  let drawing = false;

  const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: x * (canvas.width / rect.width), y: y * (canvas.height / rect.height) };
  };

  const start = (e) => { e.preventDefault(); drawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); };
  const draw = (e) => { e.preventDefault(); if(!drawing) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); };
  const stop = (e) => { e.preventDefault(); drawing = false; };

  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stop); canvas.addEventListener('mouseout', stop);
  canvas.addEventListener('touchstart', start, {passive: false}); canvas.addEventListener('touchmove', draw, {passive: false}); canvas.addEventListener('touchend', stop, {passive: false});
}

function clearSignature(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function bukaFotoPekerja() {
  const data = window.svData;
  if (!data || !data.fotoUrl || data.fotoUrl === '-' || data.fotoUrl.length < 50) {
    showAlert("⚠️ Foto pekerja tidak ditemukan atau kosong.");
    return;
  }
  
  // Buka jendela baru dan tampilkan gambar secara bersih
  const win = window.open('');
  win.document.write(`
    <html>
      <head><title>Foto Lapangan Pekerja</title></head>
      <body style="margin:0; background:#000; display:flex; align-items:center; justify-content:center; height:100vh;">
        <img src="${data.fotoUrl}" style="max-width:100%; max-height:100%; object-fit:contain;" />
      </body>
    </html>
  `);
}

function getSignatureBase64(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return '';
  const blank = document.createElement('canvas');
  blank.width = canvas.width; blank.height = canvas.height;
  const bCtx = blank.getContext('2d'); 
  bCtx.fillStyle = "#ffffff"; 
  bCtx.fillRect(0,0,blank.width,blank.height);
  if(canvas.toDataURL() === blank.toDataURL()) return ''; 
  
  // 🚀 PERBAIKAN: Gunakan JPEG 50% agar string data sangat ringan
  return canvas.toDataURL('image/jpeg', 0.5); 
}

/* ============================================================
   FUNGSI UPGRADE: GPS GEOLOCATION
   ============================================================ */
function requestGPS() {
  const gpsBox = document.getElementById('gpsIndicator');
  if (navigator.geolocation) {
    if(gpsBox) gpsBox.innerHTML = '🔄 Mencari koordinat lokasi Anda...';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        S.gps = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
        if(gpsBox) gpsBox.innerHTML = '📍 Lokasi Terkunci!';
        autoSaveDraft();
      },
      (err) => {
        S.gps = 'Akses GPS Ditolak / Gagal';
        if(gpsBox) gpsBox.innerHTML = '⚠️ Gagal mendapatkan lokasi GPS';
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  } else {
    S.gps = "GPS Tidak Didukung Browser";
  }
}

/* ============================================================
   FUNGSI UPGRADE: KAMERA (FOTO LAPANGAN)
   ============================================================ */
function handlePhotoUpload(event) {
  const file = event.target.files[0];
  if(!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      // Kompresi Gambar agar loading dan database tetap ringan
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 800;
      const scaleSize = MAX_WIDTH / img.width;
      canvas.width = MAX_WIDTH;
      canvas.height = img.height * scaleSize;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      
      S.photoBase64 = canvas.toDataURL('image/jpeg', 0.6); // Kualitas 60%

/* ============================================================
   GAS FETCH WRAPPER (UPGRADE RETRY FIX)
   ============================================================ */
async function postToGAS(payload){
  const MAX_RETRY = 3; 
  const isRespond = (payload.action === 'respond');
  
  for(let attempt = 1; attempt <= MAX_RETRY; attempt++){
    try {
      const fetchOptions = {
        method  : 'POST',
        redirect: 'follow',
        headers : {'Content-Type': 'text/plain;charset=utf-8'},
        body    : JSON.stringify(payload) 
      };
      
      const res = await fetch(CONFIG.GAS_URL, fetchOptions);
      const text = await res.text();
      
      try {
        return JSON.parse(text);
      } catch(e) {
        if (isRespond) return { ok: true, rowId: payload.rowId };
        
        // 🚀 PERBAIKAN: Jika respon bukan JSON, lempar error agar sistem mencoba ulang (RETRY)
        throw new Error("Respon server bukan data JSON. Google mungkin sedang sibuk.");
      }
      
    } catch(err) {
      if (attempt === MAX_RETRY) {
        if (isRespond) return { ok: true, rowId: payload.rowId };
        // Tampilkan pesan error yang lebih jelas jika sudah gagal 3 kali
        throw new Error("Koneksi ditolak / sinyal tidak stabil. Harap klik titik 3 di pojok kanan atas, lalu pilih 'Buka di Chrome'.");
      }
      // Tunggu jeda sebelum mencoba menarik data lagi (1.5 detik, lalu 3 detik)
      await sleep(1500 * attempt);
    }
  }
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

/* ============================================================
   OFFLINE QUEUE
   ============================================================ */
let offlineQueue = [];
try{ offlineQueue = JSON.parse(localStorage.getItem('safetyQueue') || '[]'); }
catch(e){ offlineQueue = []; }

function saveToQueue(data){
  offlineQueue.unshift({ ...data, _queuedAt: Date.now() });
  offlineQueue = offlineQueue.slice(0, 5);
  localStorage.setItem('safetyQueue', JSON.stringify(offlineQueue));
}

async function processQueue(){
  if(!navigator.onLine || offlineQueue.length === 0) return;
  const item = offlineQueue[0];
  try{
    const res = await postToGAS({ action:'submit', ...item });
    if(res && res.ok){
      offlineQueue.shift();
      localStorage.setItem('safetyQueue', JSON.stringify(offlineQueue));
      console.log('Queue synced:', res.rowId);
    }
  }catch(e){ console.warn('Queue sync failed:', e.message); }
}

window.addEventListener('online', processQueue);
setInterval(processQueue, 15000);

async function doApprove(){
  const svNamaEl = document.getElementById('svNama');
  const svPinEl  = document.getElementById('svPin');
  const svNoteEl = document.getElementById('svNote');
  
  const svNama = svNamaEl ? svNamaEl.value.trim() : '';
  const svPin  = svPinEl ? svPinEl.value.trim() : '';
  const svNote = svNoteEl ? svNoteEl.value.trim() : '';
  
  if(!svNama){ showAlert('Pilih nama supervisor terlebih dahulu'); return; }

  const PIN_RAHASIA = "7777"; 
  if(svPin !== PIN_RAHASIA){
    showAlert('❌ PIN Supervisor salah!<br>Pekerja tidak diizinkan melakukan approval.');
    return;
  }

  const sign = getSignatureBase64('spvCanvas');
  if(!sign){ showAlert("⚠️ Supervisor wajib menandatangani approval ini!"); return; }

  const data = window.svData;
  if(!data || !data.rowId){ 
    showAlert('Data supervisor tidak ditemukan atau ID rusak. Buka ulang link verifikasi.'); 
    return; 
  }

  data.sv = {
    nama   : svNama,
    status : 'APPROVED',
    note   : svNote,
    time   : formatIDDateTime(new Date()),
    signUrl: sign
  };

  showProgress('📤 Menyimpan ke Google Sheets...', 'Mohon tunggu');
  
  try{
    // 1. Simpan dulu murni ke Google Apps Script tanpa gangguan
    await postToGAS({
      action : 'respond',
      rowId  : String(data.rowId).trim(),
      status : 'APPROVED',
      svname : svNama,
      svnote : svNote,
      svtime : data.sv.time,
      svsign : sign 
    });

    hideProgress();

    // 2. SETELAH BERHASIL, baru siapkan link WhatsApp untuk Pekerja & HSE
    kirimNotifikasiKeWorker(data);

    // 3. Tampilkan halaman sukses (BERI NILAI TRUE AGAR TOMBOL MUNCUL UNTUK SPV)
    const enc = LZ.compress(JSON.stringify(data));
    showDone(enc, true); // <--- Perubahan ada di sini

  }catch(e){
    hideProgress();
    showAlert('❌ Gagal memproses: ' + e.message);
  }
}
window.doApprove = doApprove;

async function doReject(){
  const svNamaEl = document.getElementById('svNama');

  const svNama = svNamaEl ? svNamaEl.value.trim() : '';

function showDone(enc, showNotifBtn = false){
  document.getElementById('WM').style.display = 'none';
  document.getElementById('SM').style.display = 'none';
  document.getElementById('SD').style.display = 'block';
  let data;
  try{
    const decoded = LZ.decompress(enc);
    if(!decoded) throw new Error('Decode failed');
    data = JSON.parse(decoded);
  }catch(e){
    document.getElementById('SD').innerHTML = `
      <div class="section" style="text-align:center;padding:60px 24px">
        <div style="font-size:3rem;margin-bottom:16px">❌</div>
        <h3 style="color:#dc2626">Data Tidak Valid</h3>
        <p style="color:#6b7280;margin-top:8px">
          Tidak dapat membaca data checklist.
        </p>
        <button class="btn btn-primary" style="margin-top:24px"
          onclick="location.href='.'">🔄 Kembali ke Beranda</button>
      </div>`;
    return;
  }
  
  const hasSV      = !!data.sv;
  const isApproved = hasSV && data.sv.status === 'APPROVED';
  const isRejected = hasSV && data.sv.status === 'REJECTED';
  let statusIcon  = '📨';
  let statusText  = 'Menunggu Verifikasi';
  let statusColor = '#2563eb';
  let infoClass   = '';
  
  if(isApproved){
    statusIcon  = '✅';
    statusText  = 'DISETUJUI';
    statusColor = '#059669';
    infoClass   = 'approved';
  } else if(isRejected){
    statusIcon  = '❌';
    statusText  = 'DITOLAK';
    statusColor = '#dc2626';
    infoClass   = 'rejected';
  }

  // Tombol HANYA akan dirender jika showNotifBtn bernilai TRUE
  const notifSection = (hasSV && showNotifBtn)
    ? `<div style="margin-top:20px;text-align:center">
         <button class="btn btn-wa" onclick="kirimSemuaNotif(this)"
           style="width:100%">
           📱 Kirim Notifikasi ke Pekerja
         </button>
         <p id="notifHint" style="font-size:.82rem;color:#6b7280;margin-top:8px">
           Klik tombol di atas untuk mengirim notifikasi bertahap (Pekerja & HSE)
         </p>
       </div>`
    : '';

  document.getElementById('SD').innerHTML = `
    <!-- 🖨️ HEADER PRINT (Hanya muncul di kertas) -->
    <div id="printHeader" class="print-only">
      <div>
        <h2>⛑️ PAUSBIRU SAFETY</h2>

        <p id="printDateTime" style="font-weight:bold; color:#000;"></p>

      </div>
    </div>

    <!-- TAMPILAN UTAMA -->
    <div class="section">
      <div class="result-card">
        <div class="big">${statusIcon}</div>
        <h2 style="color:${statusColor};font-size:1.6rem;font-weight:900">
          ${statusText}
        </h2>
      </div>
      <div class="sbox">${buildSummaryHTML(data)}</div>
      ${hasSV ? `
        <div class="sent-info ${infoClass}">
          <strong>👨‍💼 Supervisor: ${escHtml(data.sv.nama)}</strong><br>
          Status: <strong>${escHtml(data.sv.status)}</strong><br>
          ${data.sv.note ? `📝 Catatan: ${escHtml(data.sv.note)}<br>` : ''}
          🕐 Waktu: ${escHtml(data.sv.time)}
        </div>` : ''}
      ${notifSection}
      
      <!-- 🚀 TOMBOL PRINT / PDF -->
      <button class="btn" style="margin-top:24px; width:100%; background:#475569; color:#fff;" onclick="cetakPDF()">
        🖨️ Cetak / Simpan PDF
      </button>

      <button class="btn btn-primary" style="margin-top:12px; width:100%;" onclick="location.href='.'">
        🔄 Kembali ke Beranda
      </button>
    </div>

    <!-- 🖨️ FOOTER PRINT (Hanya muncul di kertas) -->

      <span>Safety Starts With Me © 2026 | Powered by Pausbiru7</span>
      <span>Dokumen Resmi K3</span>

  `;

  // Pastikan URL WhatsApp digenerate jika tombol notif menyala
  if(hasSV && showNotifBtn) {

function next1(){
  S.n   = sanitize(document.getElementById('nama').value);
  S.nid = sanitize(document.getElementById('nid').value);
  S.p   = document.getElementById('telp').value.replace(/[^0-9]/g, '');

  const posisiEl = document.getElementById('posisi');
  const posisiLainnyaEl = document.getElementById('posisiLainnya');

  if(posisiEl && posisiEl.value === 'LAINNYA'){
    S.pt = sanitize(posisiLainnyaEl ? posisiLainnyaEl.value : '');
  } else {
    S.pt = sanitize(posisiEl ? posisiEl.value : '');
  }

  const lokasiEl = document.getElementById('lokasiSelect');
  const lokasiLainnyaEl = document.getElementById('lokasiLainnya');

  if(lokasiEl && lokasiEl.value === 'LAINNYA'){
    S.l = sanitize(lokasiLainnyaEl ? lokasiLainnyaEl.value : '');
  } else {
    S.l = sanitize(lokasiEl ? lokasiEl.value : '');
  }

  if(!S.n || !S.nid || !S.p || !S.pt || !S.l){
    showAlert('⚠️ Lengkapi semua field yang bertanda *');
    return;
  }
  
  if(!/^08[0-9]{8,12}$/.test(S.p)){
    showAlert('⚠️ Format nomor WA tidak valid.<br>Contoh: 08123456789');
    return;
  }

  if(S.spvIdx === null || S.spvIdx === undefined){
    showAlert('⚠️ Pilih supervisor terlebih dahulu');
    return;
  }

  autoSaveDraft();
  goStep(2);
}

function next2(){
  const answered = Object.keys(HC).length;
  if(answered < 4){
    showAlert(`⚠️ Jawab semua pertanyaan kesehatan.\n(${answered}/4 terjawab)`);
    return;
  }
  if(Object.values(HC).some(v => v === 'tidak')){
    showAlert(
      '⚠️ KONDISI TIDAK MEMENUHI SYARAT KERJA!\n\n' +
      'Anda menjawab "Tidak" pada salah satu pertanyaan.\n' +
      'Laporkan ke supervisor sebelum memulai pekerjaan.'
    );
    return;
  }
  goStep(3);
}

function next3(){
  const jobEl = document.getElementById('jobDesc');
  if(jobEl) S.job = sanitize(jobEl.value);

  if(!S.job){
    showAlert('⚠️ Isi deskripsi pekerjaan hari ini');
    return;
  }

  const totalHZ = Object.values(HZ).filter(h => h.checked).length
                + customHazards.length;
  if(totalHZ === 0){
    showAlert('⚠️ Pilih minimal 1 potensi bahaya');
    return;
  }

  const missingStd = Object.values(HZ)
    .filter(h => h.checked && !h.control.trim()).length;
  const missingCustom = customHazards
    .filter(h => !h.control.trim()).length;

  if(missingStd + missingCustom > 0){
    showAlert(
      `⚠️ ${missingStd + missingCustom} bahaya belum diisi tindakan kontrolnya.\n` +
      'Isi semua tindakan kontrol sebelum melanjutkan.'
    );
    return;
  }

  autoSaveDraft();
  goStep(4);
}

function next4(){
  // VALIDASI FOTO HARUS ADA
  if(!S.photoBase64){
    showAlert("⚠️ Wajib mengambil foto lapangan / APD sebelum lanjut.");
    return;
  }
  autoSaveDraft();
  goStep(5);
  
  // TRIGGER GPS DAN TANDA TANGAN KETIKA MASUK STEP 5
  requestGPS();
  setTimeout(() => initSignaturePad('workerCanvas'), 200);
}

function goStep(n){
  if(n === 2) renderStep2();
  if(n === 3) renderStep3();
  if(n === 4) renderStep4();
  if(n === 5) renderStep5();

  curStep = n;
  document.querySelectorAll('.step').forEach((el, i) => {
    el.classList.toggle('active', i + 1 === n);
  });
  renderDots();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function renderDots(){
  const el = document.getElementById('dots');
  if(!el) return;
  let html = '';
  for(let i = 1; i <= TOTAL_STEPS; i++){
    html += `<div class="dot ${i === curStep ? 'active' : ''}"></div>`;
  }
  el.innerHTML = html;
}

/* ============================================================
   BUILD DATA & SUMMARY
   ============================================================ */
function buildData(){
  const hz = [];
  Object.entries(HZ).forEach(([key, val]) => {
    if(!val.checked) return;
    const [catId, idxStr] = key.split('_');
    const cat = HZDATA.find(c => c.id === catId);
    if(cat && cat.items[parseInt(idxStr)]){
      hz.push({ name: cat.items[parseInt(idxStr)], control: val.control.trim() });
    }
  });
  customHazards.forEach(c => {
    hz.push({ name: c.text, control: c.control.trim() });
  });

  const ct = [];
  CTDATA.forEach((item, i) => {
    if(CT['ct' + i]) ct.push(item);
  });

  const spv = SUPERVISORS[S.spvIdx] || {};

  return {
    n        : S.n,
    nid      : S.nid,
    p        : S.p,
    pt       : S.pt,
    l        : S.l,
    tgl      : S.tgl,
    jam      : S.jam,
    hc       : { ...HC },
    job      : S.job,
    hz       : hz,
    ct       : ct,
    spvIdx   : S.spvIdx,  
    spv_name : spv.name   || '',
    spv_title: spv.title  || '',
    spv_wa   : spv.wa     || '',
    spv_dept : spv.dept   || ''
  };
}

/* ============================================================
   SUBMIT CHECKLIST (UPGRADE DENGAN PENANGKAP ERROR)
   ============================================================ */
async function submitChecklist(){
  // AMBIL TANDA TANGAN
  const workerSign = getSignatureBase64('workerCanvas');
  if(!workerSign) { showAlert("⚠️ Anda wajib membubuhkan tanda tangan!"); return; }

  const data = buildData();

  // INJEK DATA BARU
  data.gps = S.gps;
  data.photoBase64 = S.photoBase64;
  data.workerSign = workerSign;

  if(!data.n || !data.spv_wa){
    showAlert('Data tidak lengkap. Kembali dan periksa kembali.');
    return;
  }

  showProgress('💾 Menyimpan ke Google Sheets...', 'Mohon tunggu sebentar');

  let rowId = 'LOCAL-' + Date.now();

  try{
    const res = await postToGAS({ action:'submit', ...data });
    
    // 🚀 LOGIKA BARU: TANGKAP ERROR JIKA SERVER GAGAL
    if(res && res.ok === false) {
      hideProgress();
      showAlert("❌ SERVER ERROR:<br>" + (res.error || "Gagal menyimpan data ke Spreadsheet."));
      return; // STOP DISINI! Jangan buka WhatsApp jika data gagal masuk
    }

    if(res && res.rowId) rowId = res.rowId;
    data.rowId = rowId;
  }catch(e){
    console.warn('GAS submit failed, offline mode:', e.message);
    data.rowId = rowId;
    saveToQueue(data);
  }

  const vUrl = `${CONFIG.BASE_URL}?id=${data.rowId}`;

  try{
    await postToGAS({
      action: 'updateVerifyLink',
      rowId: data.rowId,
      verifyLink: vUrl
    });
  }catch(e){
    console.warn('Update verifyLink gagal:', e.message);
  }

  hideProgress();

  /* Buat pesan WA supervisor */
  const hzText = data.hz.map(h => `• ${h.name}\n  🛡️ ${h.control}`).join('\n');
  const ctText = data.ct.length > 0 ? data.ct.join(', ') : 'Tidak ada';

  const msg =
    `🔔 *SAFETY CHECKLIST - MOHON VERIFIKASI*\n\n` +
    `👷 Nama     : ${data.n}\n` +
    `🪪 ID       : ${data.nid}\n` +
    `📞 WA       : ${data.p}\n` +
    `💼 Jabatan  : ${data.pt}\n` +
    `📍 Lokasi   : ${data.l}\n` +
    `📅 Tanggal  : ${data.tgl} | ⏰ ${data.jam}\n\n` +
    `📝 *Pekerjaan:*\n${data.job}\n\n` +
    `⚠️ *Potensi Bahaya:*\n${hzText}\n\n` +
    `🛡️ *APD:* ${ctText}\n\n` +
    `━━━━━━━━━━━━━━━━━━━━\n` +
    `✅ *Klik link berikut untuk VERIFIKASI & CEK FOTO:*\n${vUrl}\n\n` +
    `_Powered by Pausbiru7_`;

  localStorage.removeItem('safetyDraft');

  /* Buka WA supervisor */
  const spvWA  = data.spv_wa.replace(/^0/, '62').replace(/[^0-9]/g, '');
  const waLink = `https://wa.me/${spvWA}?text=${encodeURIComponent(msg)}`;

  window._waSPVLink = waLink;
  window.open(waLink, '_blank');

  renderStep6(rowId, data.spv_name);
  goStep(6);
}

/* ============================================================
   DRAFT — AUTO SAVE & LOAD
   ============================================================ */
function autoSaveDraft(){
  try{
    const draft = {
      S             : { ...S },
      HC            : { ...HC },
      HZ            : { ...HZ },
      CT            : { ...CT },
      customHazards : [...customHazards]
    };
    localStorage.setItem('safetyDraft', LZ.compress(JSON.stringify(draft)));
  }catch(e){
    console.warn('Draft save failed:', e.message);
  }
}

function loadDraft(){
  try{
    const raw = localStorage.getItem('safetyDraft');
    if(!raw) return;

    const decoded = LZ.decompress(raw);
    if(!decoded) return;

    const draft = JSON.parse(decoded);

    if(draft.S)             Object.assign(S, draft.S);
    if(draft.HC)            Object.assign(HC, draft.HC);
    if(draft.HZ)            Object.assign(HZ, draft.HZ);
    if(draft.CT)            Object.assign(CT, draft.CT);
    if(draft.customHazards) customHazards = draft.customHazards;

  }catch(e){
    console.warn('Draft load failed, clearing:', e.message);
    localStorage.removeItem('safetyDraft');
  }
}

/* ============================================================
   UTILITY FUNCTIONS
   ============================================================ */
function formatIDDateTime(d = new Date()) {
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const yyyy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2, "0");
  const mi = String(d.getMinutes()).padStart(2, "0");
  return `${dd}/${mm}/${yyyy} ${hh}:${mi}`;
}
/* Sanitasi input — cegah XSS */
function sanitize(str){
  if(typeof str !== 'string') return '';
  return str
    .replace(/[<>&"'`]/g, '')
    .trim()
    .substring(0, 200);
}

/* Escape HTML untuk display */
function escHtml(str){
  if(typeof str !== 'string') return '';
  return str
    .replace(/&/g,  '&amp;')
    .replace(/</g,  '&lt;')
    .replace(/>/g,  '&gt;')
    .replace(/"/g,  '&quot;')
    .replace(/'/g,  '&#39;');
}

/* Custom alert — lebih baik dari native alert() */
function showAlert(msg){
  let alertEl = document.getElementById('globalAlert');
  if(!alertEl){
    document.body.insertAdjacentHTML('beforeend', `
      <div id="globalAlert" style="
        display      : none;
        position     : fixed;
        top          : 20px;
        left         : 50%;
        transform    : translateX(-50%);
        background   : #fff;
        border       : 2px solid #ef4444;
        border-radius: 16px;
        padding      : 20px 24px;
        max-width    : 340px;
        width        : 90%;
        z-index      : 9999;
        box-shadow   : 0 20px 60px rgba(0,0,0,.25);
        text-align   : center;
        font-size    : .92rem;
        color        : #1f2937;
        line-height  : 1.6">
        <div style="font-size:2rem;margin-bottom:8px">⚠️</div>
        <div id="globalAlertMsg"></div>
        <button onclick="closeAlert()" style="
          margin-top   : 16px;
          background   : #ef4444;
          color        : #fff;
          border       : none;
          border-radius: 10px;
          padding      : 10px 28px;
          font-weight  : 700;
          font-size    : .9rem;
          cursor       : pointer;
          width        : 100%">
          OK, Mengerti
        </button>
      </div>`);
    alertEl = document.getElementById('globalAlert');
  }

  document.getElementById('globalAlertMsg').innerHTML =
    msg.replace(/\n/g, '<br>');
  alertEl.style.display = 'block';
}

function closeAlert(){
  const el = document.getElementById('globalAlert');
  if(el) el.style.display = 'none';
}

/* Reset app untuk checklist baru */
function resetApp(){
  Object.keys(S).forEach(k => { S[k] = k === 'spvIdx' ? null : ''; });
  Object.keys(HC).forEach(k => delete HC[k]);
  Object.keys(HZ).forEach(k => delete HZ[k]);
  Object.keys(CT).forEach(k => delete CT[k]);
  customHazards = [];
  localStorage.removeItem('safetyDraft');
  location.href = '.';
}

/* Fungsi Pengecekan PIN Supervisor */
function checkSupervisorPin(inputVal) {
  const btnApprove = document.querySelector('.btn-approve');
  if(!btnApprove) return;
  
  if(inputVal.trim() === "7777") {
    btnApprove.disabled = false;
    btnApprove.style.opacity = "1";
    btnApprove.style.cursor = "pointer";
  } else {
    btnApprove.disabled = true;
    btnApprove.style.opacity = "0.5";
    btnApprove.style.cursor = "not-allowed";
  }
}

  const d = new Date();
  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
  
  const dateTimeEl = document.getElementById('printDateTime');
